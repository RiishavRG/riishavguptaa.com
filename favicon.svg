<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RG">
  <!-- favicon.svg - browser-tab icon: "RG" in white on the site's accent orange (#b5470b, 5.4:1 against white). -->
  <circle cx="32" cy="32" r="32" fill="#b5470b"/><!-- [L] full circle: reads as a dot of colour even at 16 px -->
  <text x="32" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#fff">RG</text><!-- [L] y=42, not 32: text sits on its baseline, so it's lowered to look centred -->
</svg>
